<div class="toolbar">
  <h2>היסטוריית שליחות</h2>
</div>

<table>
  <thead>
    <tr>
      <th>שם תזכורת</th><th>הודעה</th><th>התחלה</th><th>סיום</th><th>תוצאה</th>
    </tr>
  </thead>
  <tbody>
    @for (run of svc.history(); track run.id) {
      <tr>
        <td>{{ run.reminderName }}</td>
        <td>{{ run.message }}</td>
        <td>{{ run.startedAt | date:'dd/MM/yyyy HH:mm:ss' }}</td>
        <td>{{ run.finishedAt | date:'dd/MM/yyyy HH:mm:ss' }}</td>
        <td><span class="badge" [ngClass]="statusClass(run.status)">{{ run.status }}</span></td>
      </tr>
    } @empty {
      <tr><td colspan="5">אין עדיין היסטוריית שליחות</td></tr>
    }
  </tbody>
</table>

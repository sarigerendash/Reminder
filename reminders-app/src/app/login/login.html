<div class="login-card">
  <h2>התחברות</h2>
  <input placeholder="שם משתמש" [ngModel]="username()" (ngModelChange)="username.set($event)" />
  <input type="password" placeholder="סיסמה" [ngModel]="password()" (ngModelChange)="password.set($event)" />
  @if (error()) { <p class="error">{{ error() }}</p> }
  <button (click)="submit()">כניסה</button>
</div>
